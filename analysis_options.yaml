# Configuración del analizador para Rumbo.
# Set de lints: very_good_analysis (https://pub.dev/packages/very_good_analysis).

include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - windows/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # Es una app, no un paquete publicado: no exigimos doc en cada miembro público.
    public_member_api_docs: false
